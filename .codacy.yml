---
# Codacy configuration — https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# Excluded from analysis (all tools):
#   • generated or vendored files;
#   • the test suite, which writes real files into per-test temp directories by
#     design (every "dynamically constructed path" there is a tmp dir);
#   • build/install/dev scripts, which run at build time on the developer's or
#     CI machine, never inside the MCP server process.
# Everything under src/ and ui/ — the code that ships — is fully analysed.
# The remaining path findings in src/transfer and src/core are the file-transfer
# tools themselves; each call site is guarded by lib/paths.ts and carries a
# justified suppression comment (see ARCHITECTURE.md → Security).
exclude_paths:
  - 'package-lock.json'
  - 'coverage/**'
  - 'dist/**'
  - 'test/**'
  - 'scripts/**'
  - 'infra/dev/*.mjs'
  - 'infra/dev/docker-compose.yaml'   # generated by storj-up
  - 'infra/dev/tidb.toml'             # generated by storj-up
  - 'infra/dev/tidb-init.sql'         # generated by storj-up; TiDB/MySQL dialect, not T-SQL
