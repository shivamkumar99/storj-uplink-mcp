---
# Codacy configuration — https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# Generated or vendored files are excluded from every tool.  Test files and
# build/install scripts are excluded from the ESLint *security* patterns only:
# tests exercise real files in per-test temp directories by design, and the
# scripts run at build/install time, not inside the server.  Everything under
# src/ and ui/ is analysed with the full pattern set.
exclude_paths:
  - 'package-lock.json'
  - 'coverage/**'
  - 'dist/**'
  - 'infra/dev/docker-compose.yaml'   # generated by storj-up
  - 'infra/dev/tidb.toml'             # generated by storj-up
  - 'infra/dev/tidb-init.sql'         # generated by storj-up; TiDB/MySQL dialect, not T-SQL
engines:
  eslint:
    exclude_paths:
      - 'test/**'
      - 'scripts/**'
      - 'infra/**'
