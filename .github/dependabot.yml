# ==============================================================================
# Dependabot — keep dependencies and pinned actions current
# ==============================================================================
# Security updates arrive as soon as an advisory lands, regardless of the
# schedule below. The weekly runs pick up everything else, grouped so that a
# routine bump is one pull request to review rather than a dozen.
# ==============================================================================
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

  # Actions are pinned to commit SHAs; Dependabot rewrites the SHA and the
  # version comment together, which is the only sane way to keep pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: 'chore(docker)'
