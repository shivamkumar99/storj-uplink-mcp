# ==============================================================================
# Dependabot — keep dependencies and pinned actions current
# ==============================================================================
# Two grouped pull requests per ecosystem at most, never one per package:
#
#   <ecosystem>        every patch and minor update — safe, usually green, and
#                      the one you merge weekly. This is the routine PR.
#   <ecosystem>-major  every major update, batched together.
#
# Majors are kept out of the routine batch because one incompatible major
# blocks everything shipping with it: grouping all five npm updates together
# produced a PR that could not even install, because TypeScript 7 is outside
# the peer range of typescript-eslint 8. A red batch costs more CI than a
# separate PR does, since every push re-runs it.
#
# Dependabot cannot combine ecosystems into one PR — npm, actions and Docker
# each get their own — so a busy week is at most three PRs.
#
# cooldown holds off on a release for its first week. A compromised package is
# usually caught and yanked within days, and nothing here needs a same-day bump.
# Security updates ignore both the schedule and the grouping: an advisory opens
# its own PR immediately.
# ==============================================================================
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'

  # Actions are pinned to commit SHAs; Dependabot rewrites the SHA and the
  # version comment together, which is the only sane way to keep pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
      actions-major:
        patterns: ['*']
        update-types: [major]
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ['*']
        update-types: [minor, patch]
      docker-major:
        patterns: ['*']
        update-types: [major]
    labels: [dependencies, docker]
    commit-message:
      prefix: 'chore(docker)'
