# ==============================================================================
# CI Pipeline — lint, type-check, test, build, audit, package
# ==============================================================================
# Triggers: Push to main, all PRs
# Purpose: One job per concern, in the usual order — source lint (ESLint, knip),
#          types, unit tests, build, dependency audit, package contents, and the
#          workflows themselves (actionlint + zizmor). `ci-success` aggregates
#          them into the single check branch protection can require.
#
# Dependency install: jobs that only read the sources use
# `npm ci --ignore-scripts`. The test job needs a full `npm ci`, because
# storj-uplink-nodejs compiles or downloads its native binding in a postinstall
# script and nine test files import it for real rather than mocking it.
#
# Conventions (enforced by the workflow-lint job):
#   • every action is pinned to a commit SHA, with the version in a comment
#   • the token is read-only unless a job says otherwise
#   • checkout never persists credentials
#   • expressions never go straight into `run:` — they are passed via `env:`
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_DEFAULT: '20'

jobs:
  # ============================================================================
  # Workflow lint — syntax/expressions/shell (actionlint) + security (zizmor)
  # ============================================================================
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false   # plain output; fail the job on any finding

  # ============================================================================
  # Source lint — ESLint (type-aware, incl. the 200-line file limit) + knip
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Unused exports and dependencies (knip)
        run: npm run knip

  # ============================================================================
  # Type check — server, tests and the browser UI bundle
  # ============================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check (server)
        run: npx tsc --noEmit

      - name: Type check (tests and UI)
        run: npm run typecheck

  # ============================================================================
  # Unit tests (matrix) — Vitest over the in-memory MCP transport
  # ============================================================================
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # Full install: the native storj-uplink-nodejs binding is required by the
      # tests that exercise the real module surface.
      - name: Install dependencies
        run: npm ci

      - name: Report the native binding in use
        run: node -e "const l=require('storj-uplink-nodejs');console.log('storj-uplink-nodejs',l.VERSION,'| uplink-c',l.uplinkCVersion().storjUplink)"

      - name: Run tests
        run: npm test

  # ============================================================================
  # Build (matrix) — compile the server and the UI bundle, verify the outputs
  # ============================================================================
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify dist outputs exist
        run: |
          test -f dist/index.js || (echo "❌ dist/index.js missing" && exit 1)
          test -f dist/setup.js || (echo "❌ dist/setup.js missing" && exit 1)
          echo "✅ dist/index.js and dist/setup.js present"

      - name: Verify shebang lines
        run: |
          head -1 dist/index.js | grep -q "#!/usr/bin/env node" || (echo "❌ Missing shebang in index.js" && exit 1)
          head -1 dist/setup.js | grep -q "#!/usr/bin/env node" || (echo "❌ Missing shebang in setup.js" && exit 1)
          echo "✅ Shebang lines OK"

      - name: Verify executable permissions
        run: |
          test -x dist/index.js || (echo "❌ dist/index.js not executable" && exit 1)
          test -x dist/setup.js || (echo "❌ dist/setup.js not executable" && exit 1)
          echo "✅ Executable permissions OK"

  # ============================================================================
  # Security Audit
  # ============================================================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high

  # ============================================================================
  # Package Dry-run — verify npm pack contents
  # ============================================================================
  pack-check:
    name: Package Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pack dry-run
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          echo ""
          echo "── Packed files ──"
          cat pack-output.txt

      - name: Verify essential files in package
        run: |
          npm pack --dry-run 2>&1 | grep -q "dist/index.js" || (echo "❌ dist/index.js not in package" && exit 1)
          npm pack --dry-run 2>&1 | grep -q "dist/setup.js" || (echo "❌ dist/setup.js not in package" && exit 1)
          npm pack --dry-run 2>&1 | grep -q "scripts/postinstall.js" || (echo "❌ scripts/postinstall.js not in package" && exit 1)
          npm pack --dry-run 2>&1 | grep -q "README.md" || (echo "❌ README.md not in package" && exit 1)
          echo "✅ All essential files present in package"

  # ============================================================================
  # Aggregate gate — the single required check for branch protection
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [workflow-lint, lint, typecheck, test, build, audit, pack-check]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: |
            workflow-lint=${{ needs.workflow-lint.result }}
            lint=${{ needs.lint.result }}
            typecheck=${{ needs.typecheck.result }}
            test=${{ needs.test.result }}
            build=${{ needs.build.result }}
            audit=${{ needs.audit.result }}
            pack-check=${{ needs.pack-check.result }}
        run: |
          failed=0
          while IFS='=' read -r job result; do
            [[ -z "$job" ]] && continue
            printf '%-16s %s\n' "$job" "$result"
            [[ "$result" == "success" ]] || failed=1
          done <<< "$RESULTS"
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
