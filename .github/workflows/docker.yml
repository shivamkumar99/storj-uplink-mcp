# ==============================================================================
# Docker image — build, lint, scan, smoke-test; publish on release
# ==============================================================================
# Every push to main and every pull request:
#   hadolint the Dockerfile → build the image (linux/amd64, not pushed) →
#   Trivy vulnerability scan (HIGH/CRITICAL, fixed-only, fails the job) →
#   run the container with the production hardening flags and complete an MCP
#   handshake over stdio.
# Release tags (v*.*.*): the same, then push to Docker Hub as
#   <DOCKERHUB_USERNAME>/storj-uplink-mcp:<version>, :<major>.<minor>, :<major>, :latest
#   with SBOM + SLSA provenance attestations, and sync the README to Docker Hub.
# Manual runs can push an :edge tag for testing a build before a release.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — Docker Hub account name (also the image namespace)
#   DOCKERHUB_TOKEN    — Docker Hub personal access token with Read & Write
# The same credentials log in to dhi.io for the Docker Hardened base images.
# Pull requests from forks have no secrets: the job then reports and stops.
# ==============================================================================

name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_edge:
        description: 'Push the build to Docker Hub as :edge'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/storj-uplink-mcp
  PLATFORM: linux/amd64   # storj-uplink-nodejs ships a linux-x64 prebuilt only

jobs:
  image:
    name: Build, scan, smoke-test${{ startsWith(github.ref, 'refs/tags/v') && ', publish' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # Trivy SARIF → code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Docker Hub credentials
        id: creds
        env:
          HAS_USER: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [[ "$HAS_USER" == "true" && "$HAS_TOKEN" == "true" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set (fork PR or secrets missing); the Docker Hardened base images need them, so the image build is skipped."
          fi

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/Dockerfile
          failure-threshold: warning

      - name: Log in to dhi.io (hardened base images)
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image tags and labels
        if: steps.creds.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.push_edge }}
            type=raw,value=ci-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=storj-uplink-mcp
            org.opencontainers.image.description=MCP server for Storj decentralized cloud storage (stdio transport)
            org.opencontainers.image.licenses=MIT

      # Build once, load into the runner's Docker for scanning and the smoke test.
      - name: Build image
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy, fails on HIGH/CRITICAL with a fix)
        if: steps.creds.outputs.available == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci-${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

      - name: Upload scan results to code scanning
        if: always() && steps.creds.outputs.available == 'true' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Smoke test (MCP handshake in the hardened container)
        if: steps.creds.outputs.available == 'true'
        env:
          REF: ${{ env.IMAGE }}:ci-${{ github.sha }}
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | docker run -i --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
              --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 "$REF" \
          | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const msgs = s.split("\n").filter(Boolean).map((l) => JSON.parse(l));
              const init = msgs.find((m) => m.id === 1), list = msgs.find((m) => m.id === 2);
              if (!init?.result?.serverInfo) { console.error("no initialize result"); process.exit(1); }
              const n = list?.result?.tools?.length ?? 0;
              console.log("server", init.result.serverInfo.name, init.result.serverInfo.version, "| tools:", n);
              if (n < 20) { console.error("unexpected tool count"); process.exit(1); }
            });'

      # ---- release / manual publish only --------------------------------------
      - name: Push to Docker Hub
        if: steps.creds.outputs.available == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.push_edge))
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - name: Sync README to Docker Hub
        if: steps.creds.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/storj-uplink-mcp
          short-description: MCP server for Storj decentralized cloud storage — Docker Hardened Image, non-root, stdio transport
          readme-filepath: ./README.md

      - name: Summary
        if: steps.creds.outputs.available == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.push_edge) }}
        run: |
          {
            echo "## Docker image"
            echo ""
            echo "- Platform: $PLATFORM"
            echo "- Pushed to Docker Hub: $PUSHED"
            echo "- Tags:"
            printf '%s\n' "$TAGS" | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
