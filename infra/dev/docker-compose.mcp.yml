# Overlay: the MCP server joined to the local storj-up network.
#
#   docker compose -f infra/dev/docker-compose.yaml -f infra/dev/docker-compose.mcp.yml run --rm -T mcp
#
# Everything in this file is development-only.  docker-compose.yaml next to
# it is generated by `storj-up init db,minimal` (see storj-local.sh) and is
# the local satellite + storage nodes; this file only adds the MCP container
# with the same hardening as infra/docker-compose.yml.

services:
  mcp:
    # Override to test another build, e.g. a library branch compiled from source:
    #   MCP_IMAGE=storj-uplink-mcp:lib-dev MCP_PLATFORM=linux/arm64 npm run test:e2e
    image: ${MCP_IMAGE:-storj-uplink-mcp:local}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    platform: ${MCP_PLATFORM:-linux/amd64}
    env_file:
      - .env                       # written by storj-local.sh credentials
    depends_on:
      - satellite-api
      - storagenode1
    stdin_open: true
    tty: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    pids_limit: 128
    mem_limit: 512m
    # Scratch folder for the local-file tools (upload_file, download_file, …).
    volumes:
      - ./exchange:/data
