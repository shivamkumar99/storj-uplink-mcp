# SonarQube project configuration for storj-uplink-mcp.
#
# Run from this directory with an analysis token in the environment
# (never put the token in this file — it is committed to git):
#
#   SONAR_TOKEN=<token> sonar-scanner
#
# Generate a token in SonarQube: My Account → Security → Generate Tokens.

sonar.projectKey=storj-uplink-mcp
sonar.projectName=storj-uplink-mcp
sonar.projectVersion=1.0.0

sonar.host.url=http://localhost:9000

# Analyze only our TypeScript sources; never the build output or dependencies.
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**
sonar.sourceEncoding=UTF-8

# Lets the TypeScript analyzer resolve types (enables the deeper type-aware rules).
sonar.typescript.tsconfigPath=tsconfig.json

# Tests and coverage (Vitest → lcov). Run `npm run test:coverage` before scanning.
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Process entry points that cannot be imported by a unit test without side
# effects: index.ts connects the stdio transport and setup.ts runs the
# interactive readline wizard on import. Mirrors vitest.config.ts.
sonar.coverage.exclusions=src/index.ts,src/setup.ts
